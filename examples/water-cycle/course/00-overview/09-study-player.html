  t = t.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
  return t.replace(/\n/g, '<br>');
}
function h(tag, attrs, html){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (attrs[k] == null) continue;
    if (k === 'class') e.className = attrs[k];
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if (html != null) e.innerHTML = html;

}
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function pct(a, b){ return b ? Math.round(100 * a / b) : 0; }
function fmtTime(sec){ sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
function today(){ return Date.now(); }

var LETTERS = ['A','B','C','D'];

/* ---------- data access ---------- */

/* ---------- shell ---------- */
var tab = 'quiz';

/* ---------- quiz ---------- */

function orderFor(q, shuffleOpts){

}
function quizQuestion(app){

function answerQuiz(idx){
  var Z = state.quiz; if (!Z || Z.answered) return;
  var q = Z.list[Z.i];
  Z.chosen = idx; Z.answered = true;
  var right = Z.order[idx] === q.key;
  if (right) Z.score++; else Z.wrong.push(q);
  if (Z.hintShown) Z.hinted++;

function nextQuiz(){

function gradeCard(got){

function examById(id){ for (var i = 0; i < D.exam.questions.length; i++) if (D.exam.questions[i].id === id) return D.exam.questions[i]; return null; }

function submitExam(){
  var X = state.exam, unanswered = X.order.filter(function(id){ return !X.answers[id]; }).length;

    else { wrong.push(q); S.misses[q.id] = (S.misses[q.id] || 0) + 1; }
  });
  X.score = score; X.byCh = byCh; X.wrong = wrong;
  S.exams.push({date: dayStr(today()), score: score, total: D.exam.questions.length, pct: pct(score, D.exam.questions.length), seconds: X.seconds, byChapter: byCh});

  } else card.appendChild(h('p', {class:'strong'}, tr('cleanSweep')));
  var r = h('div', {class:'row', style:'margin-top:12px'});
  r.appendChild(h('button', {class:'btn primary', onclick: function(){ state.exam = null; tab = 'quiz'; state.quiz = null; render(); }}, tr('practiseMisses')));
  r.appendChild(h('button', {class:'btn', onclick: function(){ state.exam = null; render(); }}, tr('back')));
  card.appendChild(r); app.appendChild(card);
}

/* ---------- progress ---------- */
function viewProgress(app){
  var card = h('div', {class:'card'});
  card.appendChild(h('h2', null, esc(tr('yourProgress'))));
  var t = '<table><tr><th>' + esc(tr('thChapter')) + '</th><th>' + esc(tr('thQuizLast')) + '</th><th>' + esc(tr('thBest')) + '</th><th>' + esc(tr('thTries')) + '</th></tr>';
  D.chapters.forEach(function(c){
    var r = S.quiz['c' + c.n];
    t += '<tr><td>' + esc(tr('chTitle', {n: c.n, title: c.title})) + '</td><td>' + (r ? r.last + '%' : '-') + '</td><td>' + (r ? r.best + '%' : '-') + '</td><td>' + (r ? r.attempts : 0) + '</td></tr>';
  });
  card.appendChild(h('div', null, t + '</table>'));
  var others = [['all', tr('setAllShort')], ['final', tr('setFinalShort')], ['misses', tr('setMissesShort')], ['misses-retake', tr('setRetakeShort')]].filter(function(x){ return S.quiz[x[0]]; });
  if (others.length) {
    var o = '<h3>' + esc(tr('otherSets')) + '</h3><table><tr><th>' + esc(tr('thSet')) + '</th><th>' + esc(tr('thLast')) + '</th><th>' + esc(tr('thBest')) + '</th><th>' + esc(tr('thTries')) + '</th></tr>';
    others.forEach(function(x){ var r = S.quiz[x[0]]; o += '<tr><td>' + esc(x[1]) + '</td><td>' + r.last + '%</td><td>' + r.best + '%</td><td>' + r.attempts + '</td></tr>'; });
    card.appendChild(h('div', null, o + '</table>'));
  }
  var cards = allCards(), boxes = [0,0,0,0,0], seen = 0, due = 0;
  cards.forEach(function(c){ var r = S.cards[c.id]; if (r) { boxes[r.box - 1]++; seen++; } if (isDue(c)) due++; });
  card.appendChild(h('h3', null, esc(tr('tabCards'))));
  card.appendChild(h('p', null, esc(tr('cardsStarted', {seen: seen, total: cards.length, due: due, boxes: boxes.join(' / ')}))));
  card.appendChild(h('h3', null, esc(tr('stillMiss'))));
  var ids = Object.keys(S.misses);
  card.appendChild(h('p', null, esc(ids.length ? tr('missCount', {n: ids.length}) : tr('noMiss'))));
  if (S.exams.length) {
    card.appendChild(h('h3', null, esc(tr('examAttempts'))));
    var e = '<table><tr><th>' + esc(tr('thDate')) + '</th><th>' + esc(tr('thScore')) + '</th><th>' + esc(tr('thTime')) + '</th></tr>';
    S.exams.forEach(function(x){ e += '<tr><td>' + esc(x.date) + '</td><td>' + x.score + ' / ' + x.total + ' (' + x.pct + '%)</td><td>' + fmtTime(x.seconds) + '</td></tr>'; });
    card.appendChild(h('div', null, e + '</table>'));
  }
  var r = h('div', {class:'row', style:'margin-top:14px'});
  r.appendChild(h('button', {class:'btn primary', id:'exportbtn', onclick: exportResults}, tr('downloadBtn')));
  r.appendChild(h('button', {class:'btn', onclick: function(){ if (window.confirm(tr('resetConfirm'))) { S = blank(); save(); state = {quiz:null, cards:null, exam:null}; render(); } }}, tr('resetBtn')));
  card.appendChild(r);
  card.appendChild(h('p', {class:'muted small', style:'margin-top:10px'}, esc(tr('savedOnly') + (memoryOnly ? tr('blocked') : '') + tr('sendTutor'))));
  app.appendChild(card);
}
function exportResults(){
  var out = {course: D.title, exportedAt: new Date().toISOString(), quiz: S.quiz, exams: S.exams,
    misses: Object.keys(S.misses).map(function(id){ var q = byId(id); return {id: id, count: S.misses[id], chapter: q && q.ch || null, question: q ? q.stem.slice(0, 160) : ''}; }),
    flashcards: Object.keys(S.cards).map(function(id){ return {id: id, box: S.cards[id].box, due: dayStr(S.cards[id].due), seen: S.cards[id].seen}; })};
  var blob = new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = D.id + '-results.json';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(ev){
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var tag = (ev.target && ev.target.tagName) || '';
  if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
  var k = ev.key, KL = k.length === 1 ? k.toLowerCase() : k;
  if (tab === 'quiz' && state.quiz && !state.quiz.done) {
    var Z = state.quiz;
    var idx = 'abcd'.indexOf(KL); if (idx < 0 && '1234'.indexOf(KL) >= 0) idx = '1234'.indexOf(KL);
    if (!Z.answered && idx >= 0 && idx < Z.order.length) { ev.preventDefault(); answerQuiz(idx); }
    else if (Z.answered && (k === 'Enter' || k === ' ' || k === 'ArrowRight')) { ev.preventDefault(); nextQuiz(); }
  } else if (tab === 'cards' && state.cards && !state.cards.done) {
    var C = state.cards;
    if (!C.shown && (k === ' ' || k === 'Enter')) { ev.preventDefault(); C.shown = true; render(); }
    else if (C.shown && (KL === '1' || k === 'ArrowLeft')) { ev.preventDefault(); gradeCard(false); }
    else if (C.shown && (KL === '2' || k === 'ArrowRight')) { ev.preventDefault(); gradeCard(true); }
  } else if (tab === 'exam' && state.exam && !state.exam.done) {
    var X = state.exam, id = X.order[X.i], i2 = 'abcd'.indexOf(KL);
    if (i2 >= 0 && i2 < X.opt[id].length) { ev.preventDefault(); X.answers[id] = X.opt[id][i2]; render(); }
    else if (k === 'ArrowRight' && X.i + 1 < X.order.length) { X.i++; render(); }
    else if (k === 'ArrowLeft' && X.i > 0) { X.i--; render(); }
  }
});

/* ---------- start ---------- */
document.getElementById('title').textContent = D.title;
document.documentElement.lang = D.lang || 'en';
document.documentElement.dir = D.dir || 'ltr';
document.getElementById('tabs').setAttribute('aria-label', tr('studyModes'));
var C = D.counts || {chapters: D.chapters.length, questions: allQuestions().length, cards: allCards().length, exam: D.exam ? D.exam.questions.length : 0};
document.getElementById('subtitle').textContent = tr('subtitle', C) + (C.exam ? tr('subtitleExam', {n: C.exam}) : '');
document.getElementById('foot').innerHTML = md(D.audience ? tr('footerAudience', {a: D.audience}) : tr('footerDefault'));
window.__sgt = {D: D, t: tr, S: function(){ return S; }, state: function(){ return state; }, render: render, setTab: function(t){ tab = t; render(); }};
render();
})();
</script>
