<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Water Cycle</title>
<style>
:root{--bg:#f6f6f2;--card:#ffffff;--ink:#1c2125;--muted:#58626b;--line:#d9dde1;--accent:#2457c5;--accent-ink:#ffffff;
--ok:#0f6e50;--okbg:#e3f4ec;--bad:#a8231b;--badbg:#fcebea;--warn:#7a4f00;--warnbg:#fff3d6;--shadow:0 1px 2px rgba(0,0,0,.06);--hl:#ffe27a;--hlink:#1c2125}
@media (prefers-color-scheme:dark){:root{--bg:#121518;--card:#1b2024;--ink:#e7e9ec;--muted:#9aa4ad;--line:#323a41;--accent:#8ab4ff;--accent-ink:#0b1220;
--ok:#6bd6a9;--okbg:#12342a;--bad:#ff9d95;--badbg:#391a18;--warn:#f0c36c;--warnbg:#382d11;--shadow:none;--hl:#6b5a14;--hlink:#fff3c4}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,main,footer{max-width:820px;margin:0 auto;padding:0 16px}
header{padding-top:18px}
h1{font-size:1.25rem;margin:0 0 2px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 12px}
nav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
nav button{font:inherit;background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer}
nav button[aria-selected=true]{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.muted{color:var(--muted)}
.small{font-size:.88rem}
button.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select{width:100%}
select,input[type=number]{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
label{display:inline-flex;gap:6px;align-items:center}
.stem{font-size:1.05rem;margin:0 0 14px}
.opts{display:grid;gap:8px}
button.opt{font:inherit;text-align:start;display:flex;gap:10px;width:100%;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
button.opt:hover:not(:disabled){border-color:var(--accent)}
button.opt .L{font-weight:700;min-width:1.4em;color:var(--muted)}
button.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
button.opt.ok{background:var(--okbg);border-color:var(--ok)}
button.opt.bad{background:var(--badbg);border-color:var(--bad)}
button.opt:disabled{cursor:default}
.panel{border-radius:10px;padding:12px 14px;margin-top:12px}
.panel.ok{background:var(--okbg);border:1px solid var(--ok)}
.panel.bad{background:var(--badbg);border:1px solid var(--bad)}
.panel.hint{background:var(--warnbg);border:1px solid var(--warn);color:var(--ink)}
.panel h3{margin:0 0 4px;font-size:1rem}
.why{margin:8px 0 0;padding-left:0;list-style:none}
.why li{margin:4px 0}
.tag{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);margin-right:6px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:start;font-size:.92rem}
.flash{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15rem;padding:18px}
.grid{display:flex;gap:6px;flex-wrap:wrap}
.grid button{min-width:36px;padding:4px 8px}
.grid button.done{background:var(--okbg);border-color:var(--ok)}
.grid button.cur{outline:2px solid var(--accent)}
.big{font-size:2rem;font-weight:700;margin:0}
.weak{color:var(--bad);font-weight:600}
.strong{color:var(--ok);font-weight:600}
code{background:rgba(127,127,127,.15);border-radius:4px;padding:0 4px;font-size:.92em}
footer{padding:18px 16px 40px;color:var(--muted);font-size:.85rem}
.sr{position:absolute;left:-9999px}
.lesson{padding:6px 22px 18px}
.lesson h1{font-size:1.4rem;margin:.8em 0 .3em}
.lesson h2{font-size:1.25rem;margin:1.7em 0 .5em;padding-top:1em;border-top:1px solid var(--line)}
.lesson h2:first-child{border-top:0;margin-top:.8em;padding-top:0}
.lesson h3{font-size:1.06rem;margin:1.4em 0 .4em}
.lesson p{margin:.6em 0}
.lesson ul,.lesson ol{padding-inline-start:1.4em;margin:.5em 0}
.lesson li{margin:.2em 0}
.lesson a{color:var(--accent)}
.lesson img{max-width:100%;height:auto}
.lesson hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.lesson pre{overflow-x:auto;background:rgba(127,127,127,.12);padding:10px 12px;border-radius:8px;font-size:.88rem}
.lesson pre code{background:none;padding:0}
.tablewrap{overflow-x:auto;margin:.8em 0}
.lesson th{background:rgba(127,127,127,.1);font-weight:600}
.lesson blockquote{margin:1em 0;padding:.5em 1em;border-inline-start:4px solid var(--line);background:rgba(127,127,127,.06);border-radius:6px}
.lesson blockquote p{margin:.3em 0}
.lesson blockquote.callout{background:var(--warnbg);border-color:var(--warn)}
.lesson blockquote.audience{font-size:.84rem;color:var(--muted);background:none;border-color:var(--line)}
.lesson details{border:1px solid var(--line);border-radius:8px;padding:.45em .9em;margin:.7em 0}
.lesson details[open]{padding-bottom:.6em}
.lesson summary{cursor:pointer;font-weight:600}
.diagram{background:#fff;color:#1c2125;border:1px solid var(--line);border-radius:10px;padding:12px;margin:1em 0;overflow-x:auto}
.diagram svg{max-width:100%;height:auto;display:block;margin:0 auto}
.diagram pre{background:none;color:inherit;margin:6px 0 0}
.deadlink{color:var(--muted);border-bottom:1px dotted var(--muted)}
.secnav{position:sticky;top:0;z-index:6;display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding:8px 2px;margin:0 0 12px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin}
.secnav a{flex:0 0 auto;font-size:.85rem;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;background:var(--card);white-space:nowrap}
.secnav a[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.lesson h2,.lesson h3{scroll-margin-top:64px}
mark.hl{background:var(--hl);color:var(--hlink);border-radius:3px;padding:0 1px;cursor:pointer}
mark.hl.has-note{border-bottom:2px solid var(--warn)}
mark.hl.flash{outline:3px solid var(--accent)}
#notepop{position:absolute;z-index:30;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.28);padding:8px;display:flex;flex-direction:column;gap:6px;width:max-content;max-width:min(380px,calc(100vw - 16px))}
#notepop.tb{flex-direction:row}
#notepop textarea{width:min(360px,calc(100vw - 40px));min-height:92px;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.notelist{list-style:none;padding:0;margin:8px 0 0}
.notelist li{border-top:1px solid var(--line);padding:10px 0}
.notelist blockquote{margin:0 0 6px;padding:2px 10px;border-inline-start:4px solid var(--hl);color:var(--muted);font-size:.92rem}
.notetext{white-space:pre-wrap;margin:4px 0 8px}
details.notes>summary{cursor:pointer;font-weight:600}
.lessonbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lessonbar select{width:auto;flex:1 1 260px}
.lessonbar a{color:var(--accent)}
@media (max-width:520px){body{font-size:15.5px}.card{padding:14px}.lesson{padding:2px 12px 14px}}
</style>
</head>

le-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel\"><p>2 Condensation<br />vapour cools into clouds<\/p><\/span><\/div><\/foreignObject><\/g><\/g><g class=\"node default\" id=\"mmde169c17c24-flowchart-C-3\" data-look=\"classic\" transform=\"translate(622.6796875, 47)\"><rect class=\"basic label-container\" style=\"\" x=\"-107.7265625\" y=\"-39\" width=\"215.453125\" height=\"78\"/><g class=\"label\" style=\"\" transform=\"translate(-77.7265625, -24)\"><rect/><foreignObject width=\"155.453125\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel\"><p>3 Precipitation<br />rain, snow, sleet, hail<\/p><\/span><\/div><\/foreignObject><\/g><\/g><g class=\"node default\" id=\"mmde169c17c24-flowchart-D-5\" data-look=\"classic\" transform=\"translate(910.40625, 84)\"><rect class=\"basic label-container\" style=\"\" x=\"-130\" y=\"-51\" width=\"260\" height=\"102\"/><g class=\"label\" style=\"\" transform=\"translate(-100, -36)\"><rect/><foreignObject width=\"200\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel\"><p>4 Collection<br />oceans, lakes, rivers, underground<\/p><\/span><\/div><\/foreignObject><\/g><\/g><\/g><\/g><\/g><defs><filter id=\"mmde169c17c24-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/><\/filter><\/defs><defs><filter id=\"mmde169c17c24-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/><\/filter><\/defs><linearGradient id=\"mmde169c17c24-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"hsl(0, 0%, 83.3333333333%)\" stop-opacity=\"1\"/><stop offset=\"100%\" stop-color=\"hsl(0, 0%, 88.9215686275%)\" stop-opacity=\"1\"/><\/linearGradient><\/svg><\/div>\n<p><em>Four stages in a loop; collection feeds the next evaporation.<\/em><\/p>\n<h3 id=\"l1-numbers-names-and-lists-to-know\">Numbers, names and lists to know<\/h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Item<\/th><th>Exactly as taught<\/th><\/tr><\/thead><tbody><tr><td>The four stages in order<\/td><td>evaporation, condensation, precipitation, collection<\/td><\/tr><tr><td>Evaporation<\/td><td>liquid water turns into water vapour, driven by heat from the sun<\/td><\/tr><tr><td>Condensation<\/td><td>water vapour cools and turns into tiny droplets that form clouds<\/td><\/tr><tr><td>Precipitation<\/td><td>water falls from clouds as rain, snow, sleet or hail<\/td><\/tr><tr><td>Collection<\/td><td>water gathers in oceans, lakes, rivers and underground<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"l1-look-alikes-to-keep-apart\">Look-alikes to keep apart<\/h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Item<\/th><th>The difference<\/th><\/tr><\/thead><tbody><tr><td>Evaporation and condensation<\/td><td>evaporation turns liquid into vapour; condensation turns vapour back into droplets<\/td><\/tr><tr><td>Precipitation and collection<\/td><td>precipitation is water falling from clouds; collection is where fallen water gathers<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"l1-words-used-in-this-chapter\">Words used in this chapter<\/h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Term<\/th><th>Plain words<\/th><\/tr><\/thead><tbody><tr><td>Water vapour<\/td><td>water as an invisible gas in the air<\/td><\/tr><tr><td>Droplet<\/td><td>a very small drop of liquid water<\/td><\/tr><tr><td>Cloud<\/td><td>a mass of tiny droplets floating in the air<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Everything below explains the same ideas as a story. The quiz is next: <a href=\"#\" data-go=\"quiz:1\">03-quiz.md<\/a>.<\/p>\n<p><strong>Source:<\/strong> slides 2-6 of the water-cycle deck. Every fact matches <a href=\"../chapter-01-the-four-stages/99-fact-ledger.md\" target=\"_blank\" rel=\"noopener\">99-fact-ledger.md<\/a>.<\/p>\n<h2 id=\"l1-1-what-happens-to-the-puddle-when-the-sun-comes-out\">1. What happens to the puddle when the sun comes out?<\/h2>\n<p><strong>The problem.<\/strong> A puddle vanishes by afternoon, yet nobody carried the water away. The water went somewhere, and the first stage of the cycle explains where.<\/p>\n<p>Heat from the sun makes the surface molecules of liquid water move fast enough to leave as vapour. That is evaporation, and it needs no boiling: a puddle in warm air does it all day. Once the vapour is up in the air it rises, and that sets up the second stage.<\/p>\n<p><em>Everyday picture (my analogy):<\/em> a wet towel on a washing line. The towel dries because the water leaves it as vapour, and the line is not even hot.<\/p>\n<blockquote class=\"callout\"><p><strong>⚠ Tricky part: evaporation or condensation?<\/strong><br>Both involve water vapour, so they get swapped.<br><strong>Hint:<\/strong> ask which way the water is changing: from liquid up into vapour, or from vapour back into droplets.<\/p><\/blockquote>\n<details>\n<summary>Rule and anchor<\/summary>\n<p><strong>Rule:<\/strong> evaporation turns liquid water into vapour using the sun's heat; condensation turns vapour back into tiny droplets.\n<strong>Anchor:<\/strong> (my anchor) evaporation goes up, condensation comes back.<\/p>\n<\/details>\n<details>\n<summary><b>Predict:<\/b> a wet road dries in an hour on a sunny afternoon. Which stage removed the water from the road?<\/summary>\n<p>Evaporation: the sun's heat turned the liquid into vapour.<\/p>\n<\/details>\n<p><strong>Next question: what does the vapour do once it is up there?<\/strong><\/p>\n<h2 id=\"l1-2-how-does-the-vapour-come-back-down\">2. How does the vapour come back down?<\/h2>\n<p><strong>The problem.<\/strong> The air cannot hold unlimited vapour, and the vapour does not stay up forever. Three stages bring the water back toward the ground.<\/p>\n<p>As the vapour rises it meets colder air and cools. Cooled vapour turns into tiny droplets, and enough droplets together make a cloud: this is condensation. When droplets grow heavy they fall as rain, snow, sleet or hail, which is precipitation. The water then gathers in oceans, lakes, rivers and underground, and that last stage is collection, where the loop closes.<\/p>\n<p><em>Everyday picture (my analogy):<\/em> a cold glass on a summer table gets beaded with water. The glass did not leak; the air around it cooled and shed some of its vapour.<\/p>\n<blockquote class=\"callout\"><p><strong>⚠ Tricky part: precipitation or collection?<\/strong><br>Both are about water arriving, so they get swapped.<br><strong>Hint:<\/strong> ask whether the water is still on its way down or has already gathered somewhere.<\/p><\/blockquote>\n<details>\n<summary>Rule and anchor<\/summary>\n<p><strong>Rule:<\/strong> precipitation is water falling from clouds as rain, snow, sleet or hail; collection is water gathering in oceans, lakes, rivers and underground.\n<strong>Anchor:<\/strong> (my anchor) falling versus gathering.<\/p>\n<\/details>\n<details>\n<summary><b>Predict:<\/b> on a winter night a window pane is covered with fine droplets on the inside. Which stage is happening there?<\/summary>\n<p>Condensation: warm indoor vapour met the cold glass and turned back into liquid.<\/p>\n<\/details>\n<h2 id=\"l1-say-it-back-no-peeking\">Say it back (no peeking)<\/h2>\n<details>\n<summary>1. Put the four stages in order and say what drives the first one.<\/summary>\n<p>Evaporation, condensation, precipitation, collection; the first is driven by heat from the sun.<\/p>\n<\/details>\n<details>\n<summary>2. What separates precipitation from collection?<\/summary>\n<p>Precipitation is the water falling out of the cloud; collection is where it ends up.<\/p>\n<\/details>\n<h2 id=\"l1-traps-to-avoid\">Traps to avoid<\/h2>\n<p>The last warning before the quiz. Each row is a mix-up the exam is built on; the &quot;Tricky part&quot; boxes in the sections above show how to tell each pair apart.<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>Trap<\/th><th>Why it fools people<\/th><\/tr><\/thead><tbody><tr><td>Evaporation and condensation are the same<\/td><td>Both involve vapour; one makes it, the other turns it back into droplets<\/td><\/tr><tr><td>Precipitation and collection are the same<\/td><td>Both are about water arriving; one is falling, the other is gathered<\/td><\/tr><tr><td>The cycle stops at collection<\/td><td>Collection feeds the next evaporation, so the loop closes<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"l1-next\">Next<\/h2>\n<p>Next: <a href=\"#\" data-go=\"quiz:1\">03-quiz.md<\/a> (test yourself) · <a href=\"#\" data-go=\"cards:1\">02-flashcards.csv<\/a><\/p>\n<hr>\n<blockquote class=\"audience\"><p><strong>Audience:<\/strong> written for a beginner to the topic with no technical background, studying for general understanding with no deadline. Adapted to the learner profile. Pictures and tables first, definitions in the words the profile asks for, an example per idea. Left out: only what the goal does not test; the fact ledger keeps every fact. Facts never change with the level, only the wording, examples, order and difficulty. Wrong level (&quot;too simple&quot;, &quot;too dense&quot;, &quot;too easy&quot;, &quot;too hard&quot;)? Tell me and I will regenerate. Profile: <a href=\"../learner-profile.md\" target=\"_blank\" rel=\"noopener\"><code>learner-profile.md<\/code><\/a>, version 1.<\/p><\/blockquote>", "toc": [[2, "At a glance (read this first, about 3 minutes)", "l1-at-a-glance-read-this-first-about-3-minutes"], [3, "Picture 1: the four stages", "l1-picture-1-the-four-stages"], [3, "Numbers, names and lists to know", "l1-numbers-names-and-lists-to-know"], [3, "Look-alikes to keep apart", "l1-look-alikes-to-keep-apart"], [3, "Words used in this chapter", "l1-words-used-in-this-chapter"], [2, "1. What happens to the puddle when the sun comes out?", "l1-1-what-happens-to-the-puddle-when-the-sun-comes-out"], [2, "2. How does the vapour come back down?", "l1-2-how-does-the-vapour-come-back-down"], [2, "Say it back (no peeking)", "l1-say-it-back-no-peeking"], [2, "Traps to avoid", "l1-traps-to-avoid"], [2, "Next", "l1-next"]], "minutes": 6, "md": "../chapter-01-the-four-stages/01-lesson.md"}}, {"n": 2, "title": "Where the water goes", "questions": [{"id": "c2q1", "n": 1, "ch": 2, "label": "Medium", "stem": "A forest releases moisture into the air on a warm morning. Which pairing of term and meaning is correct?", "opts": {"A": "Condensation: plants release water vapour through their leaves, and with evaporation it is called evapotranspiration", "B": "Transpiration: ice turns directly into vapour, and with evaporation it is called evapotranspiration", "C": "Precipitation: plants release water vapour through their leaves, and with evaporation it is called evapotranspiration", "D": "Transpiration: plants release water vapour through their leaves, and with evaporation it is called evapotranspiration"}, "key": "D", "explanation": "Transpiration is plants releasing water vapour through their leaves; with evaporation it is evapotranspiration.", "why": {"A": "Condensation is vapour turning into droplets, not a plant process.", "B": "Ice turning directly into vapour is sublimation.", "C": "Precipitation is water falling from clouds."}, "hint": "think of leaves.", "source": "Slide 7", "fixed": false}, {"id": "c2q2", "n": 2, "ch": 2, "label": "Hard", "stem": "Which statement about where Earth's water is found matches the lecture?", "opts": {"A": "About 3% of Earth's water is salt water in the oceans, and the rest is fresh water in lakes", "B": "About 97% of Earth's water is salt water in the oceans, and the rest is fresh water, ice and vapour", "C": "About 97% of Earth's water is fresh water in lakes, and the rest is salt water in the oceans", "D": "About 50% of Earth's water is salt water in the oceans, and the rest is fresh water and ice"}, "key": "B", "explanation": "About 97% of Earth's water is salt water in the oceans.", "why": {"A": "Swaps the percentage: salt water is the large share, not 3%.", "C": "Calls the large share fresh water, but it is salt water.", "D": "50% is not the figure the lecture gives."}, "hint": "most of the planet's water is in the oceans.", "source": "Slide 8", "fixed": false}, {"id": "c2q3", "n": 3, "ch": 2, "label": "Medium", "stem": "Rain lands on a hillside; some water streams down into a river and some disappears into the soil. Which pairing of terms is correct?", "opts": {"A": "Runoff is water flowing over land into streams and rivers; infiltration is water soaking into the ground and becoming groundwater", "B": "Runoff is water soaking into the ground and becoming groundwater; infiltration is water flowing over land into streams or rivers", "C": "Runoff is water turning directly into vapour; infiltration is water falling from clouds as rain", "D": "Runoff is water gathering in oceans only; infiltration is water cooling into droplets that form clouds"}, "key": "A", "explanation": "Runoff flows over land into streams and rivers; infiltration soaks into the ground and becomes groundwater.", "why": {"B": "Swaps the two terms.", "C": "Turning directly into vapour is sublimation; falling from clouds is precipitation.", "D": "Collection is where water gathers; condensation forms clouds."}, "hint": "one stays on top, one goes down.", "source": "Slide 9", "fixed": false}, {"id": "c2q4", "n": 4, "ch": 2, "label": "Hard", "stem": "Snow on a cold, dry mountain slope disappears without ever forming a pool of liquid water. Which term fits?", "opts": {"A": "Condensation, in which water vapour cools and turns into tiny droplets that form clouds", "B": "Infiltration, in which water soaks into the ground and becomes groundwater", "C": "Sublimation, in which ice turns directly into vapour without becoming liquid first", "D": "Collection, in which water gathers in oceans, lakes, rivers and underground"}, "key": "C", "explanation": "Sublimation: ice turns directly into vapour without becoming liquid first.", "why": {"A": "Condensation needs vapour to cool into droplets, which is the opposite direction.", "B": "Infiltration is water soaking into the ground.", "D": "Collection is water gathering in oceans, lakes, rivers and underground."}, "hint": "no liquid stage.", "source": "Slide 10", "fixed": false}], "cards": [{"q": "What is transpiration?", "a": "Plants releasing water vapour through their leaves; with evaporation it is called evapotranspiration."}, {"q": "How much of Earth's water is salt water in the oceans?", "a": "About 97%."}, {"q": "Runoff or infiltration?", "a": "Runoff flows over land into streams and rivers; infiltration soaks into the ground and becomes groundwater."}, {"q": "What is sublimation?", "a": "Ice turning directly into vapour without becoming liquid first."}], "lesson": {"html": "<h2 id=\"l2-at-a-glance-read-this-first-about-3-minutes\">At a glance (read this first, about 3 minutes)<\/h2>\n<p>The puddle story continues: plants add vapour of their own, the rain that falls takes different paths, and ice can skip a step.<\/p>\n<h3 id=\"l2-picture-1-where-does-fallen-water-go\">Picture 1: where does fallen water go?<\/h3>\n<div class=\"diagram\" role=\"img\" aria-label=\"Diagram\"><svg id=\"mmd9931b3ac81\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" class=\"flowchart\" style=\"max-width: 691.125px; background-color: transparent;\" viewBox=\"0 0 691.125 270\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#mmd9931b3ac81{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-a classic\" transform=\"translate(370.640625, 211)\"><rect class=\"basic label-container\" style=\"\" x=\"-130\" y=\"-51\" width=\"260\" height=\"102\"/><g class=\"label\" style=\"\" transform=\"translate(-100, -36)\"><rect/><foreignObject width=\"200\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel\"><p>Infiltration<br />into the ground, becoming groundwater<\/p><\/span><\/div><\/foreignObject><\/g><\/g><g class=\"node default\" id=\"mmd9931b3ac81-flowchart-C-5\" data-look=\"classic\" transform=\"translate(616.8828125, 135)\"><rect class=\"basic label-container\" style=\"\" x=\"-66.2421875\" y=\"-27\" width=\"132.484375\" height=\"54\"/><g class=\"label\" style=\"\" transform=\"translate(-36.2421875, -12)\"><rect/><foreignObject width=\"72.484375\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel\"><p>Collection<\/p><\/span><\/div><\/foreignObject><\/g><\/g><\/g><\/g><\/g><defs><filter id=\"mmd9931b3ac81-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/><\/filter><\/defs><defs><filter id=\"mmd9931b3ac81-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/><\/filter><\/defs><linearGradient id=\"mmd9931b3ac81-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"hsl(0, 0%, 83.3333333333%)\" stop-opacity=\"1\"/><stop offset=\"100%\" stop-color=\"hsl(0, 0%, 88.9215686275%)\" stop-opacity=\"1\"/><\/linearGradient><\/svg><\/div>\n<p><em>Two paths from the same rain, both leading toward collection.<\/em><\/p>\n<h3 id=\"l2-numbers-names-and-lists-to-know\">Numbers, names and lists to know<\/h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Item<\/th><th>Exactly as taught<\/th><\/tr><\/thead><tbody><tr><td>Transpiration<\/td><td>plants release water vapour through their leaves; with evaporation it is called evapotranspiration<\/td><\/tr><tr><td>Share of Earth's water that is salt water in the oceans<\/td><td>about 97%<\/td><\/tr><tr><td>Runoff<\/td><td>water flowing over land into streams and rivers<\/td><\/tr><tr><td>Infiltration<\/td><td>water soaking into the ground and becoming groundwater<\/td><\/tr><tr><td>Sublimation<\/td><td>ice turns directly into vapour without becoming liquid first<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"l2-look-alikes-to-keep-apart\">Look-alikes to keep apart<\/h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Item<\/th><th>The difference<\/th><\/tr><\/thead><tbody><tr><td>Evaporation and transpiration<\/td><td>evaporation comes off water; transpiration comes out of plant leaves<\/td><\/tr><tr><td>Runoff and infiltration<\/td><td>runoff flows over land into streams and rivers; infiltration soaks into the ground and becomes groundwater<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"l2-words-used-in-this-chapter\">Words used in this chapter<\/h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Term<\/th><th>Plain words<\/th><\/tr><\/thead><tbody><tr><td>Groundwater<\/td><td>water held in the soil and rock below the surface<\/td><\/tr><tr><td>Evapotranspiration<\/td><td>the two ways water reaches the air from the land, taken together<\/td><\/tr><tr><td>Salt water<\/td><td>water with salt dissolved in it, as in the oceans<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Everything below explains the same ideas as a story. The quiz is next: <a href=\"#\" data-go=\"quiz:2\">03-quiz.md<\/a>.<\/p>\n<p><strong>Source:<\/strong> slides 7-10 of the water-cycle deck. Every fact matches <a href=\"../chapter-02-where-the-water-goes/99-fact-ledger.md\" target=\"_blank\" rel=\"noopener\">99-fact-ledger.md<\/a>.<\/p>\n<h2 id=\"l2-1-how-do-plants-join-in\">1. How do plants join in?<\/h2>\n<p><strong>The problem.<\/strong> Puddles are not the only source of vapour. Land covered with plants gives off water too, and the lecture gives that its own name.<\/p>\n<p>The plants growing around the puddle add to the vapour, because their leaves release water into the air as well. The lecture calls that transpiration. Evaporation from surfaces and transpiration from plants together are called evapotranspiration, the two ways water reaches the air from the land.<\/p>\n<p><em>Everyday picture (my analogy):<\/em> a field of grass on a warm day is like a crowd of tiny breathing mouths, each one letting a little water out.<\/p>\n<blockquote class=\"callout\"><p><strong>⚠ Tricky part: evaporation or transpiration?<\/strong><br>Both put water vapour into the air, so the words get swapped.<br><strong>Hint:<\/strong> ask whether the vapour came off a body of water or out of a plant.<\/p><\/blockquote>\n<details>\n<summary>Rule and anchor<\/summary>\n<p><strong>Rule:<\/strong> evaporation turns liquid water into vapour using the sun's heat; transpiration is plants releasing vapour through their leaves; the two together are evapotranspiration.\n<strong>Anchor:<\/strong> (my anchor) the puddle breathes out, and so do the leaves beside it.<\/p>\n<\/details>\n<details>\n<summary><b>Predict:<\/b> a greenhouse is sealed, yet its glass fogs up after a sunny morning in a room full of tomato plants. Which source supplied most of the vapour?<\/summary>\n<p>The plants, through transpiration: the leaves released the vapour, and the glass cooled it.<\/p>\n<\/details>\n<p><strong>Next question: once the water has fallen, which way does it travel?<\/strong><\/p>\n<h2 id=\"l2-2-where-does-the-fallen-water-travel\">2. Where does the fallen water travel?<\/h2>\n<p><strong>The problem.<\/strong> Rain lands on one hillside and ends up in a river, in the soil and in the sea. Three ideas sort out the paths.<\/p>\n<p>Water that flows over land and into streams and rivers is runoff. Water that soaks into the ground and becomes groundwater is infiltration. Either path leads toward collection. The oceans are where most of it finally sits: about 97% of Earth's water is salt water in the oceans. In very cold, dry places ice can skip the liquid step completely and turn directly into vapour, which is sublimation.<\/p>\n<blockquote class=\"callout\"><p><strong>⚠ Tricky part: runoff or infiltration?<\/strong><br>Both describe rain water leaving the surface, so they blur together.<br><strong>Hint:<\/strong> ask whether the water stays on top of the ground or goes down into it.<\/p><\/blockquote>\n<details>\n<summary>Rule and anchor<\/summary>\n<p><strong>Rule:<\/strong> runoff flows over land into streams and rivers; infiltration soaks into the ground and becomes groundwater.\n<strong>Anchor:<\/strong> (my anchor) runoff runs, infiltration sinks in.<\/p>\n<\/details>\n<details>\n<summary><b>Predict:<\/b> a paved car park floods while a nearby lawn stays dry after the same storm. Which path did the lawn's water take?<\/summary>\n<p>Infiltration: the soil let the water soak in, while the pavement forced it to run off.<\/p>\n<\/details>\n<h2 id=\"l2-say-it-back-no-peeking\">Say it back (no peeking)<\/h2>\n<details>\n<summary>1. Why can a plant make a window fog up?<\/summary>\n<p>Transpiration releases vapour through leaves, and cool glass turns it back into liquid.<\/p>\n<\/details>\n<details>\n<summary>2. How do runoff and infiltration differ?<\/summary>\n<p>Runoff flows over land into streams and rivers; infiltration soaks into the ground as groundwater.<\/p>\n<\/details>\n<h2 id=\"l2-traps-to-avoid\">Traps to avoid<\/h2>\n<p>The last warning before the quiz. Each row is a mix-up the exam is built on; the &quot;Tricky part&quot; boxes in the sections above show how to tell each pair apart.<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>Trap<\/th><th>Why it fools people<\/th><\/tr><\/thead><tbody><tr><td>Evaporation and transpiration are the same<\/td><td>Both put vapour in the air; one comes off water, the other out of leaves<\/td><\/tr><tr><td>Runoff and infiltration are the same<\/td><td>Both move rain water; one stays on top, the other goes into the ground<\/td><\/tr><tr><td>Ice must melt before it becomes vapour<\/td><td>Sublimation skips the liquid step completely<\/td><\/tr><tr><td>Most of Earth's water is fresh<\/td><td>About 97% is salt water in the oceans<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"l2-next\">Next<\/h2>\n<p>Next: <a href=\"#\" data-go=\"quiz:2\">03-quiz.md<\/a> (test yourself) · <a href=\"#\" data-go=\"cards:2\">02-flashcards.csv<\/a><\/p>\n<hr>\n<blockquote class=\"audience\"><p><strong>Audience:<\/strong> written for a beginner to the topic with no technical background, studying for general understanding with no deadline. Adapted to the learner profile. Pictures and tables first, definitions in the words the profile asks for, an example per idea. Left out: only what the goal does not test; the fact ledger keeps every fact. Facts never change with the level, only the wording, examples, order and difficulty. Wrong level (&quot;too simple&quot;, &quot;too dense&quot;, &quot;too easy&quot;, &quot;too hard&quot;)? Tell me and I will regenerate. Profile: <a href=\"../learner-profile.md\" target=\"_blank\" rel=\"noopener\"><code>learner-profile.md<\/code><\/a>, version 1.<\/p><\/blockquote>", "toc": [[2, "At a glance (read this first, about 3 minutes)", "l2-at-a-glance-read-this-first-about-3-minutes"], [3, "Picture 1: where does fallen water go?", "l2-picture-1-where-does-fallen-water-go"], [3, "Numbers, names and lists to know", "l2-numbers-names-and-lists-to-know"], [3, "Look-alikes to keep apart", "l2-look-alikes-to-keep-apart"], [3, "Words used in this chapter", "l2-words-used-in-this-chapter"], [2, "1. How do plants join in?", "l2-1-how-do-plants-join-in"], [2, "2. Where does the fallen water travel?", "l2-2-where-does-the-fallen-water-travel"], [2, "Say it back (no peeking)", "l2-say-it-back-no-peeking"], [2, "Traps to avoid", "l2-traps-to-avoid"], [2, "Next", "l2-next"]], "minutes": 6, "md": "../chapter-02-where-the-water-goes/01-lesson.md"}}], "final": null, "exam": {"minutes": 10, "questions": [{"id": "x1", "n": 1, "ch": 1, "label": "Hard", "stem": "Which sequence lists the four stages of the water cycle in order?", "opts": {"A": "Evaporation, then condensation, then precipitation, then collection, after which the cycle begins again", "B": "Evaporation, then precipitation, then condensation, then collection, after which the cycle begins again", "C": "Condensation, then evaporation, then collection, then precipitation, after which the cycle begins again", "D": "Collection, then precipitation, then evaporation, then condensation, after which the cycle begins again"}, "key": "A", "explanation": "The order is evaporation, condensation, precipitation, collection.", "why": {"B": "Swaps condensation and precipitation; clouds must form before water falls.", "C": "Starts with condensation and puts collection before precipitation.", "D": "Starts at collection, which is the last stage."}, "hint": "water has to rise before it can fall.", "source": "Slide 2", "fixed": false}, {"id": "x2", "n": 2, "ch": 2, "label": "Hard", "stem": "Which statement about where Earth's water is found matches the lecture?", "opts": {"A": "About 3% of Earth's water is salt water in the oceans, and the rest is fresh water in lakes", "B": "About 97% of Earth's water is salt water in the oceans, and the rest is fresh water, ice and vapour", "C": "About 97% of Earth's water is fresh water in lakes, and the rest is salt water in the oceans", "D": "About 50% of Earth's water is salt water in the oceans, and the rest is fresh water and ice"}, "key": "B", "explanation": "About 97% of Earth's water is salt water in the oceans.", "why": {"A": "Swaps the percentage: salt water is s water gathering in oceans, lakes, rivers and underground"}, "key": "D", "explanation": "Precipitation is water falling from clouds as rain, snow, sleet or hail; collection is water gathering in oceans, lakes, rivers and underground.", "why": {"A": "Swaps the two stages.", "B": "The sun's heat turning water into vapour is evaporation.", "C": "Cooling into tiny droplets is condensation."}, "hint": "one is falling, the other is gathering.", "source": "Slides 5-6", "fixed": false}, {"id": "x5", "n": 5, "ch": 2, "label": "Hard", "stem": "Snow on a cold, dry mountain slope disappears without ever forming a pool of liquid water. Which term fits?", "opts": {"A": "Condensation, in which water vapour cools and turns into tiny droplets that form clouds", "B": "Infiltration, in which water soaks into the ground and becomes groundwater", "C": "Sublimation, in which ice turns directly into vapour without becoming liquid first", "D": "Collection, in which water gathers in oceans, lakes, rivers and underground"}, "key": "C", "explanation": "Sublimation: ice turns directly into vapour without becoming liquid first.", "why": {"A": "Condensation needs vapour to cool into droplets, which is the opposite direction.", "B": "Infiltration is water soaking into the ground.", "D": "Collection is water gathering in oceans, lakes, rivers and underground."}, "hint": "no liquid stage.", "source": "Slide 10", "fixed": false}, {"id": "x6", "n": 6, "ch": 1, "label": "Medium", "stem": "Warm air from a hot shower meets a cold bathroom mirror and fine droplets appear on the glass. Which stage does this match?", "opts": {"A": "Evaporation, in which liquid water turns into water vapour, driven by heat from the sun", "B": "Condensation, in which water vapour cools and turns into tiny droplets that form clouds", "C": "Precipitation, in which water falls from clouds as rain, snow, sleet or hail", "D": "Collection, in which water gathers in oceans, lakes, rivers and underground"}, "key": "B", "explanation": "Condensation: water vapour cools and turns into tiny droplets that form clouds (here the cold mirror plays the part of the cold air).", "why": {"A": "Evaporation goes the other way, from liquid to vapour.", "C": "Precipitation is water falling from clouds, not droplets forming on glass.", "D": "Collection is where fallen water gathers."}, "hint": "warm vapour meets something cold.", "source": "Slide 4", "fixed": false}]}, "lang": "en", "dir": "ltr", "ui": {}}</script>

function textMap(root){

    var b = en.node === r.endContainer ? r.endOffset : en.node.nodeValue.length;

  D.chapters.forEach(function(c){ sets.push({id:'c' + c.n, label: tr('setCh', {n: c.n, title: c.title, k: c.questions.length}), qs: c.questions, mix: false}); });
  if (D.final) sets.push({id:'final', label: tr('setFinal', {n: D.final.questions.length}), qs: D.final.questions, mix: true});
  var missIds = Object.keys(S.misses);
  var missQs = missIds.map(byId).filter(Boolean);
  if (missQs.length) sets.push({id:'misses', label: tr('setMisses', {n: missQs.length}), qs: missQs, mix: true});
  return sets;
}
function viewQuiz(app){
  if (state.quiz && state.quiz.done) return quizSummary(app);
  if (state.quiz) return quizQuestion(app);
  var sets = quizSets();
  var card = h('div', {class:'card'});
  card.appendChild(h('h2', null, esc(tr('quizPick'))));
  var sel = h('select', {id:'qset', 'aria-label': tr('quizSetLabel')});
  sets.forEach(function(s){ sel.appendChild(h('option', {value:s.id}, esc(s.label))); });
  if (preset.quiz && sets.some(function(s){ return s.id === preset.quiz; })) sel.value = preset.quiz;
  preset.quiz = null;
  card.appendChild(sel);
  var opts = h('div', {class:'row', style:'margin:12px 0'});
  opts.appendChild(h('label', null, '<input type="checkbox" id="qshuf" checked> ' + esc(tr('shufOpts'))));
  opts.appendChild(h('label', null, '<input type="checkbox" id="qmix"> ' + esc(tr('shufQs'))));
  card.appendChild(opts);
  card.appendChild(h('p', {class:'muted small'}, tr('quizHelp')));
  card.appendChild(h('button', {class:'btn primary', id:'qstart', onclick: function(){
    var set = sets.filter(function(s){ return s.id === sel.value; })[0];
    var qs = set.qs.slice();
    if (document.getElementById('qmix').checked || set.mix) qs = shuffle(qs);
    state.quiz = {set:set, list:qs, i:0, shuffleOpts:document.getElementById('qshuf').checked, score:0, hinted:0, wrong:[], answered:false, hintShown:false, order:null};
    render();
  }}, tr('start')));
  app.appendChild(card);
}
function orderFor(q, shuffleOpts){
  var base = LETTERS.filter(function(L){ return q.opts[L] != null; });
  return (shuffleOpts && !q.fixed) ? shuffle(base) : base;
}
function quizQuestion(app){
  var Z = state.quiz, q = Z.list[Z.i];
  if (!Z.order) Z.order = orderFor(q, Z.shuffleOpts);
  var card = h('div', {class:'card'});
  var top = h('div', {class:'row'});
  top.appendChild(h('span', {class:'muted small grow'}, esc(tr('qOf', {i: Z.i + 1, n: Z.list.length})) + (q.ch ? ' · ' + esc(chapterTitle(q.ch)) : '') + ' · ' + esc(q.label || '')));
  top.appendChild(h('button', {class:'btn small', onclick: function(){ state.quiz = null; render(); }}, tr('quit')));
  card.appendChild(top);
  card.appendChild(h('div', {class:'bar', style:'margin:8px 0 14px'}, '<i style="width:' + pct(Z.i, Z.list.length) + '%"></i>'));
  card.appendChild(h('p', {class:'stem'}, md(q.stem)));
  var box = h('div', {class:'opts', role:'group', 'aria-label': tr('answerOptions')});
  Z.order.forEach(function(orig, idx){
    var b = h('button', {class:'opt', 'data-orig':orig, 'data-idx':idx, disabled: Z.answered ? 'disabled' : null, onclick: function(){ answerQuiz(idx); }},
      '<span class="L">' + LETTERS[idx] + '</span><span>' + md(q.opts[orig]) + '</span>');
    if (!Z.answered) b.removeAttribute('disabled');
    if (Z.answered) {
      b.disabled = true;
      if (orig === q.key) b.classList.add('ok');
      else if (idx === Z.chosen) b.classList.add('bad');
    }
    box.appendChild(b);
  });
  card.appendChild(box);
  if (!Z.answered) {
    var r = h('div', {class:'row', style:'margin-top:12px'});
    if (q.hint) r.appendChild(h('button', {class:'btn small', id:'hintbtn', onclick: function(){ Z.hintShown = true; render(); }}, Z.hintShown ? tr('hintShown') : tr('hintShow')));
    card.appendChild(r);
    if (Z.hintShown && q.hint) card.appendChild(h('div', {class:'panel hint'}, '<strong>' + esc(tr('hintWord')) + '</strong> ' + md(q.hint)));
  } else {
    var right = Z.order[Z.chosen] === q.key;
    var p = h('div', {class:'panel ' + (right ? 'ok' : 'bad'), id:'feedback'});
    p.appendChild(h('h3', null, right ? tr('correct') : tr('notQuite')));
    var correctIdx = Z.order.indexOf(q.key);
    p.appendChild(h('div', null, '<strong>' + LETTERS[correctIdx] + ':</strong> ' + md(q.explanation || q.opts[q.key])));
    var ul = h('ul', {class:'why'});
    Z.order.forEach(function(orig, idx){
      if (orig === q.key) return;
      var w = q.why && q.why[orig];
      if (!w) return;
      ul.appendChild(h('li', null, '<strong>' + LETTERS[idx] + (idx === Z.chosen ? ' ' + esc(tr('yourPick')) : '') + ':</strong> ' + md(w)));
    });
    if (ul.children.length) p.appendChild(ul);
    if (q.source) p.appendChild(h('div', {class:'small muted', style:'margin-top:8px'}, esc(tr('source', {s: q.source}))));
    card.appendChild(p);
    card.appendChild(h('div', {class:'row', style:'margin-top:12px'},
      '<button class="btn primary" id="nextbtn">' + (Z.i + 1 < Z.list.length ? esc(tr('nextQ')) : esc(tr('seeResults'))) + '</button>'));
    card.querySelector('#nextbtn').addEventListener('click', nextQuiz);
  }
  app.appendChild(card);
  if (Z.answered) { var nb = document.getElementById('nextbtn'); if (nb) nb.focus({preventScroll: true}); }
}
function answerQuiz(idx){
  var Z = state.quiz; if (!Z || Z.answered) return;
  var q = Z.list[Z.i];
  Z.chosen = idx; Z.answered = true;
  var right = Z.order[idx] === q.key;
  if (right) Z.score++; else Z.wrong.push(q);
  if (Z.hintShown) Z.hinted++;
  if (right) { if (S.misses[q.id]) delete S.misses[q.id]; }
  else { S.misses[q.id] = (S.misses[q.id] || 0) + 1; }
  save(); say(right ? tr('correct') : tr('notQuite'));
  render();
}
function nextQuiz(){
  var Z = state.quiz;
  if (Z.i + 1 < Z.list.length) { Z.i++; Z.answered = false; Z.hintShown = false; Z.order = null; Z.chosen = null; }
  else {
    Z.done = true;
    var rec = S.quiz[Z.set.id] || {attempts: 0, best: 0};
    rec.attempts++; rec.last = pct(Z.score, Z.list.length); rec.best = Math.max(rec.best, rec.last); rec.total = Z.list.length; rec.date = dayStr(today());
    S.quiz[Z.set.id] = rec; save();
  }
  render();
}
function quizSummary(app){
  var Z = state.quiz, n = Z.list.length;
  var card = h('div', {class:'card'});
  card.appendChild(h('h2', null, tr('results', {label: esc(Z.set.label)})));
  card.appendChild(h('p', {class:'big'}, Z.score + ' / ' + n + ' (' + pct(Z.score, n) + '%)'));
  card.appendChild(h('p', {class:'muted'}, Z.hinted ? tr('hintedN', {n: Z.hinted}) : tr('noHints')));
  if (Z.wrong.length) {
    card.appendChild(h('h3', null, esc(tr('toRevisit'))));
    var ul = h('ul', {class:'why'});
    Z.wrong.forEach(function(q){ ul.appendChild(h('li', null, '<strong>' + md(q.stem.length > 140 ? q.stem.slice(0, 140) + '…' : q.stem) + '</strong><br><span class="muted">' + esc(tr('answerLbl')) + ' ' + md(q.opts[q.key]) + '</span>')); });
    card.appendChild(ul);
  } else card.appendChild(h('p', {class:'strong'}, tr('cleanSweep')));
  var r = h('div', {class:'row', style:'margin-top:12px'});
  if (Z.wrong.length) r.appendChild(h('button', {class:'btn primary', onclick: function(){
    var qs = shuffle(Z.wrong);
    state.quiz = {set:{id:'misses-retake', label: tr('retakeLabel'), qs:qs, mix:true}, list:qs, i:0, shuffleOpts:true, score:0, hinted:0, wrong:[], answered:false, hintShown:false, order:null};
    render();
  }}, tr('retakeBtn')));
  r.appendChild(h('button', {class:'btn', onclick: function(){ state.quiz = null; render(); }}, tr('backSets')));
  card.appendChild(r);
  app.appendChild(card);
}

/* ---------- flashcards ---------- */
function cardRec(id){ return S.cards[id] || {box: 1, due: 0, seen: 0}; }
function isDue(c){ return cardRec(c.id).due <= today(); }
function viewCards(app){
  if (state.cards && state.cards.done) return cardsSummary(app);
  if (state.cards) return cardsFace(app);
  var cards = allCards();
  var card = h('div', {class:'card'});
  card.appendChild(h('h2', null, esc(tr('tabCards'))));
  var sel = h('select', {id:'cset', 'aria-label': tr('deckLabel')});
  sel.appendChild(h('option', {value:'all'}, esc(tr('deckAll', {n: cards.length}))));
  D.chapters.forEach(function(c){ if (c.cards.length) sel.appendChild(h('option', {value:String(c.n)}, esc(tr('deckCh', {n: c.n, title: c.title, k: c.cards.length})))); });
  if (preset.cards && Array.prototype.some.call(sel.options, function(o){ return o.value === preset.cards; })) sel.value = preset.cards;
  preset.cards = null;
  card.appendChild(sel);
  var info = h('p', {class:'muted small', id:'cinfo', style:'margin:10px 0'});
  card.appendChild(info);
  function pick(){
    var v = sel.value; return cards.filter(function(c){ return v === 'all' || String(c.ch) === v; });
  }
  function upd(){
    var set = pick(), due = set.filter(isDue).length, fresh = set.filter(function(c){ return !S.cards[c.id]; }).length;
    info.textContent = tr('cardInfo', {due: due, fresh: fresh});
    start.disabled = false; start.textContent = due ? tr('studyDue', {n: Math.min(due, 20)}) : tr('studyAnyway');
  }
  var start = h('button', {class:'btn primary', id:'cstart', onclick: function(){
    var set = pick(), due = shuffle(set.filter(isDue));
    var list = due.length ? due.slice(0, 20) : shuffle(set).slice(0, 10);
    state.cards = {list:list, i:0, shown:false, got:0, missed:[]}; render();
  }}, tr('start'));
  card.appendChild(start);
  sel.addEventListener('change', upd); upd();
  app.appendChild(card);
}
function cardsFace(app){
  var Z = state.cards, c = Z.list[Z.i];
  var card = h('div', {class:'card'});
  var top = h('div', {class:'row'});
  top.appendChild(h('span', {class:'muted small grow'}, esc(tr('cardOf', {i: Z.i + 1, n: Z.list.length, ch: chapterTitle(c.ch), b: cardRec(c.id).box}))));
  top.appendChild(h('button', {class:'btn small', onclick: function(){ state.cards = null; render(); }}, tr('quit')));
  card.appendChild(top);
  card.appendChild(h('div', {class:'bar', style:'margin:8px 0 14px'}, '<i style="width:' + pct(Z.i, Z.list.length) + '%"></i>'));
  card.appendChild(h('div', {class:'flash card'}, md(Z.shown ? c.a : c.q)));
  var r = h('div', {class:'row'});
  if (!Z.shown) r.appendChild(h('button', {class:'btn primary', id:'revealbtn', onclick: function(){ Z.shown = true; render(); }}, tr('showAnswer')));
  else {
    r.appendChild(h('button', {class:'btn', id:'missbtn', onclick: function(){ gradeCard(false); }}, tr('missedIt')));
    r.appendChild(h('button', {class:'btn primary', id:'gotbtn', onclick: function(){ gradeCard(true); }}, tr('knewIt')));
  }
  card.appendChild(r);
  card.appendChild(h('p', {class:'muted small', style:'margin-top:10px'}, tr('cardKeys')));
  app.appendChild(card);
}
function gradeCard(got){
  var Z = state.cards, c = Z.list[Z.i], rec = cardRec(c.id);
  rec.seen = (rec.seen || 0) + 1;
  if (got) { rec.box = Math.min(5, rec.box + 1); Z.got++; }
  else { rec.box = 1; Z.missed.push(c); }
  rec.due = today() + INTERVALS[rec.box - 1] * DAY;
  if (!got) rec.due = today();
  S.cards[c.id] = rec; save();
  if (Z.i + 1 < Z.list.length) { Z.i++; Z.shown = false; } else Z.done = true;
  render();
}
function cardsSummary(app){
  var Z = state.cards, card = h('div', {class:'card'});
  card.appendChild(h('h2', null, esc(tr('sessionDone'))));
  card.appendChild(h('p', {class:'big'}, tr('knownN', {got: Z.got, n: Z.list.length})));
  if (Z.missed.length) {
    card.appendChild(h('h3', null, esc(tr('missedToday'))));
    var ul = h('ul', {class:'why'});
    Z.missed.forEach(function(c){ ul.appendChild(h('li', null, '<strong>' + md(c.q) + '</strong><br><span class="muted">' + md(c.a) + '</span>')); });

  var r = h('div', {class:'row', style:'margin-top:12px'});
  if (Z.missed.length) r.appendChild(h('button', {class:'btn primary', onclick: function(){ state.cards = {list:shuffle(Z.missed), i:0, shown:false, got:0, missed:[]}; render(); }}, tr('againMisses')));

  card.appendChild(r); app.appendChild(card);
}

/* ---------- exam ---------- */
var timer = null;
function viewExam(app){
  var E = D.exam;
  if (state.exam && state.exam.done) return examResults(app);
  if (state.exam) return examQuestion(app);
  var card = h('div', {class:'card'});
  card.appendChild(h('h2', null, esc(tr('tabExam'))));
  card.appendChild(h('p', null, esc(tr('examIntro', {n: E.questions.length, minutes: E.minutes}))));
  var last = S.exams.length ? S.exams[S.exams.length - 1] : null;
  if (last) card.appendChild(h('p', {class:'muted small'}, esc(tr('lastAttempt', {score: last.score, total: last.total, pct: last.pct, date: last.date}))));
  card.appendChild(h('button', {class:'btn primary', id:'examstart', onclick: function(){
    state.exam = {i:0, answers:{}, started:today(), minutes:E.minutes, order: shuffle(E.questions.map(function(q){ return q.id; })), opt:{}};
    E.questions.forEach(function(q){ state.exam.opt[q.id] = orderFor(q, true); });
    startTimer(); render();
  }}, tr('startExam')));
  app.appendChild(card);
}
function startTimer(){
  if (timer) clearInterval(timer);
  timer = setInterval(function(){
    var X = state.exam; if (!X || X.done) { clearInterval(timer); return; }
    var el = document.getElementById('timer'); if (el) el.textContent = timeLeft(X);
  }, 1000);
}
function timeLeft(X){ var left = X.minutes * 60 - (today() - X.started) / 1000; return left < 0 ? tr('overBy', {t: fmtTime(Math.abs(left))}) : fmtTime(Math.abs(left)); }
function examById(id){ for (var i = 0; i < D.exam.questions.length; i++) if (D.exam.questions[i].id === id) return D.exam.questions[i]; return null; }
function examQuestion(app){
  var X = state.exam, id = X.order[X.i], q = examById(id), order = X.opt[id];
  var card = h('div', {class:'card'});
  var top = h('div', {class:'row'});
  top.appendChild(h('span', {class:'grow muted small'}, esc(tr('qOf', {i: X.i + 1, n: X.order.length}))));
  top.appendChild(h('span', {class:'tag', id:'timer'}, timeLeft(X)));
  card.appendChild(top);
  var grid = h('div', {class:'grid', style:'margin:10px 0 14px'});
  X.order.forEach(function(qid, k){
    var b = h('button', {class:'btn' + (X.answers[qid] ? ' done' : '') + (k === X.i ? ' cur' : ''), 'aria-label': tr('goToQ', {n: k + 1}), onclick: function(){ X.i = k; render(); }}, String(k + 1));
    grid.appendChild(b);
  });
  card.appendChild(grid);
  card.appendChild(h('p', {class:'stem'}, md(q.stem)));
  var box = h('div', {class:'opts', role:'group', 'aria-label': tr('answerOptions')});
  order.forEach(function(orig, idx){
    var b = h('button', {class:'opt' + (X.answers[id] === orig ? ' sel' : ''), 'data-orig':orig, onclick: function(){ X.answers[id] = orig; render(); }},
      '<span class="L">' + LETTERS[idx] + '</span><span>' + md(q.opts[orig]) + '</span>');
    box.appendChild(b);
  });
  card.appendChild(box);
  var r = h('div', {class:'row', style:'margin-top:14px'});
  r.appendChild(h('button', {class:'btn', disabled: X.i === 0 ? 'disabled' : null, onclick: function(){ X.i--; render(); }}, tr('prev')));
  r.appendChild(h('button', {class:'btn', disabled: X.i + 1 >= X.order.length ? 'disabled' : null, onclick: function(){ X.i++; render(); }}, tr('next')));
  r.appendChild(h('span', {class:'grow'}));
  r.appendChild(h('button', {class:'btn primary', id:'examsubmit', onclick: submitExam}, tr('submitExam')));
  card.appendChild(r);
  Array.prototype.forEach.call(card.querySelectorAll('button'), function(b){ if (b.getAttribute('disabled') == null) b.removeAttribute('disabled'); });
  app.appendChild(card);
}
function submitExam(){
  var X = state.exam, unanswered = X.order.filter(function(id){ return !X.answers[id]; }).length;
  if (unanswered && !window.confirm(tr('unanswered', {n: unanswered}))) return;
  X.done = true; X.seconds = Math.round((today() - X.started) / 1000);
  var byCh = {}, score = 0, wrong = [];
  D.exam.questions.forEach(function(q){
    var ok = X.answers[q.id] === q.key, c = q.ch || 0;
    byCh[c] = byCh[c] || {right: 0, total: 0}; byCh[c].total++;
    if (ok) { score++; byCh[c].right++; if (S.misses[q.id]) delete S.misses[q.id]; }
    else { wrong.push(q); S.misses[q.id] = (S.misses[q.id] || 0) + 1; }
  });
  X.score = score; X.byCh = byCh; X.wrong = wrong;
  S.exams.push({date: dayStr(today()), score: score, total: D.exam.questions.length, pct: pct(score, D.exam.questions.length), seconds: X.seconds, byChapter: byCh});
  save(); clearInterval(timer); render();
}

  r.appendChild(h('button', {class:'btn', onclick: function(){ state.exam = null; render(); }}, tr('back')));
  card.appendChild(r); app.appendChild(card);

    card.appendChild(h('h3', null, esc(tr('examAttempts'))));
    var e = '<table><tr><th>' + esc(tr('thDate')) + '</th><th>' + esc(tr('thScore')) + '</th><th>' + esc(tr('thTime')) + '</th></tr>';
    S.exams.forEach(function(x){ e += '<tr><td>' + esc(x.date) + '</td><td>' + x.score + ' / ' + x.total + ' (' + x.pct + '%)</td><td>' + fmtTime(x.seconds) + '</td></tr>'; });
    card.appendChild(h('div', null, e + '</table>'));
  }
  var r = h('div', {class:'row', style:'margin-top:14px'});
  r.appendChild(h('button', {class:'btn primary', id:'exportbtn', onclick: exportResults}, tr('downloadBtn')));
  r.appendChild(h('button', {class:'btn', onclick: function(){ if (window.confirm(tr('resetConfirm'))) { S = blank(); save(); state = {quiz:null, cards:null, exam:null}; render(); } }}, tr('resetBtn')));
  card.appendChild(r);
  card.appendChild(h('p', {class:'muted small', style:'margin-top:10px'}, esc(tr('savedOnly') + (memoryOnly ? tr('blocked') : '') + tr('sendTutor'))));
  app.appendChild(card);
}
function exportResults(){
  var out = {course: D.title, exportedAt: new Date().toISOString(), quiz: S.quiz, exams: S.exams, lessonsRead: Object.keys(S.read).map(Number),
    notes: D.chapters.filter(function(c){ return notesFor(c.n).length; }).map(function(c){ return {chapter: c.n, title: c.title, items: notesFor(c.n).map(function(n){ return {quote: n.quote, note: n.note}; })}; }),
    misses: Object.keys(S.misses).map(function(id){ var q = byId(id); return {id: id, count: S.misses[id], chapter: q && q.ch || null, question: q ? q.stem.slice(0, 160) : ''}; }),
    flashcards: Object.keys(S.cards).map(function(id){ return {id: id, box: S.cards[id].box, due: dayStr(S.cards[id].due), seen: S.cards[id].seen}; })};
  var blob = new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = D.id + '-results.json';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && pop) { hidePop(); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var tag = (ev.target && ev.target.tagName) || '';
  if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
  var k = ev.key, KL = k.length === 1 ? k.toLowerCase() : k;
  if (tab === 'lesson' && popMode === 'tb' && (KL === 'h' || KL === 'n')) { ev.preventDefault(); if (KL === 'h') addNote(''); else openEditor(null); return; }
  if (tab === 'quiz' && state.quiz && !state.quiz.done) {
    var Z = state.quiz;
    var idx = 'abcd'.indexOf(KL); if (idx < 0 && '1234'.indexOf(KL) >= 0) idx = '1234'.indexOf(KL);
    if (!Z.answered && idx >= 0 && idx < Z.order.length) { ev.preventDefault(); answerQuiz(idx); }
    else if (Z.answered && (k === 'Enter' || k === ' ' || k === 'ArrowRight')) { ev.preventDefault(); nextQuiz(); }
  } else if (tab === 'cards' && state.cards && !state.cards.done) {
    var C = state.cards;
    if (!C.shown && (k === ' ' || k === 'Enter')) { ev.preventDefault(); C.shown = true; render(); }
    else if (C.shown && (KL === '1' || k === 'ArrowLeft')) { ev.preventDefault(); gradeCard(false); }
    else if (C.shown && (KL === '2' || k === 'ArrowRight')) { ev.preventDefault(); gradeCard(true); }
  } else if (tab === 'exam' && state.exam && !state.exam.done) {
    var X = state.exam, id = X.order[X.i], i2 = 'abcd'.indexOf(KL);
    if (i2 >= 0 && i2 < X.opt[id].length) { ev.preventDefault(); X.answers[id] = X.opt[id][i2]; render(); }
    else if (k === 'ArrowRight' && X.i + 1 < X.order.length) { X.i++; render(); }
    else if (k === 'ArrowLeft' && X.i > 0) { X.i--; render(); }
  }
});

/* ---------- start ---------- */
document.getElementById('title').textContent = D.title;
document.documentElement.lang = D.lang || 'en';
document.documentElement.dir = D.dir || 'ltr';
document.getElementById('tabs').setAttribute('aria-label', tr('studyModes'));
var C = D.counts || {chapters: D.chapters.length, questions: allQuestions().length, cards: allCards().length, exam: D.exam ? D.exam.questions.length : 0};
document.getElementById('subtitle').textContent = tr('subtitle', C) + (C.exam ? tr('subtitleExam', {n: C.exam}) : '');
document.getElementById('foot').innerHTML = md(D.audience ? tr('footerAudience', {a: D.audience}) : tr('footerDefault'));
window.__sgt = {D: D, t: tr, S: function(){ return S; }, state: function(){ return state; }, render: render, go: go, checkSelection: checkSelection, notesMd: notesMd, setTab: function(t){ tab = t; render(); }};
render();
})();
</script>
